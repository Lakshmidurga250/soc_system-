<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentinelAI // Operations Control Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0c101d;
      --bg-surface: #111827;
      --bg-card: #161e31;
      --bg-card-hover: #1c263e;
      --bg-lavender-subtle: rgba(196, 181, 253, 0.05);
      --border: rgba(167, 139, 250, 0.14);
      --border-focus: rgba(139, 92, 246, 0.4);
      --border-subtle: rgba(148, 163, 184, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-purple: #8b5cf6;
      --accent-lavender: #c4b5fd;
      --accent-violet: #7c3aed;
      --accent-indigo: #6366f1;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --blue: #3b82f6;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-heading: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      background-image: 
        radial-gradient(at 10% 10%, rgba(139, 92, 246, 0.05) 0px, transparent 45%),
        radial-gradient(at 90% 90%, rgba(99, 102, 241, 0.04) 0px, transparent 45%);
      background-attachment: fixed;
    }
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-heading); }
    .shell { display: flex; min-height: 100vh; }
    aside.sidebar {
      width: 260px;
      background: rgba(12, 16, 29, 0.98);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 50;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .brand-logo .symbol { font-size: 22px; color: var(--accent-lavender); }
    .brand-logo h1 { font-size: 17px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    .brand-logo span { font-size: 9px; color: var(--accent-lavender); letter-spacing: 1.2px; font-weight: 600; display: block; }
    .nav-links { display: flex; flex-direction: column; gap: 3px; flex: 1; overflow-y: auto; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-item:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .nav-item.active {
      color: #fff;
      background: rgba(139, 92, 246, 0.16);
      border-left: 3px solid var(--accent-purple);
      font-weight: 600;
    }
    .sidebar-footer {
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .user-status { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-purple));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; color: #fff;
    }
    .user-details .name { font-size: 12px; font-weight: 600; color: #fff; }
    .user-details .role { font-size: 10px; color: var(--accent-lavender); font-family: var(--font-mono); }
    .btn-signout {
      background: transparent; border: 1px solid var(--border);
      color: var(--text-dim); padding: 7px; border-radius: 6px;
      font-size: 11px; cursor: pointer; transition: all 0.2s;
    }
    .btn-signout:hover { background: rgba(244, 63, 94, 0.12); color: var(--rose); border-color: rgba(244, 63, 94, 0.3); }

    .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    header.top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 28px; border-bottom: 1px solid var(--border);
      background: rgba(12, 16, 29, 0.85); backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 40;
    }
    .top-bar h2 { font-size: 17px; font-weight: 700; color: #fff; }
    .top-bar p { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }
    .system-badge {
      display: flex; align-items: center; gap: 8px;
      background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 6px 12px; border-radius: 999px;
      font-size: 11px; font-weight: 600; color: var(--emerald); font-family: var(--font-mono);
    }
    .pulse-dot {
      width: 6px; height: 6px; background: var(--emerald); border-radius: 50%;
      box-shadow: 0 0 8px var(--emerald); animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; transform: scale(1.3); } 100% { opacity: 0.6; } }

    .page-container { padding: 22px 28px; display: flex; flex-direction: column; gap: 18px; }
    .card-panel {
      background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 18px; position: relative;
      box-shadow: var(--shadow-sm);
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-header h3 { font-size: 14px; font-weight: 600; color: #fff; }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
    .kpi-tile {
      background: #151d30; border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;
    }
    .kpi-tile .label { font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.5px; }
    .kpi-tile .value { font-size: 24px; font-weight: 700; font-family: var(--font-mono); color: #fff; }
    .kpi-tile .subtext { font-size: 10px; color: var(--accent-lavender); font-family: var(--font-mono); }

    .table-wrap { width: 100%; overflow-x: auto; }
    table.soc-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
    table.soc-table th {
      background: #111827; color: var(--text-dim);
      font-weight: 600; font-size: 10px; text-transform: uppercase;
      padding: 10px 12px; border-bottom: 1px solid var(--border);
    }
    table.soc-table td { padding: 10px 12px; border-bottom: 1px solid rgba(148, 163, 184, 0.06); color: var(--text-muted); }
    table.soc-table tr:hover td { background: rgba(255, 255, 255, 0.02); color: #fff; }
    code { font-family: var(--font-mono); font-size: 11px; background: rgba(0, 0, 0, 0.25); padding: 2px 6px; border-radius: 4px; color: var(--accent-lavender); }

    .badge {
      display: inline-flex; align-items: center; padding: 2px 7px;
      border-radius: 4px; font-size: 9px; font-weight: 700;
      font-family: var(--font-mono); text-transform: uppercase;
    }
    .badge.critical { background: rgba(244, 63, 94, 0.14); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.28); }
    .badge.high { background: rgba(245, 158, 11, 0.14); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.28); }
    .badge.medium { background: rgba(139, 92, 246, 0.14); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, 0.28); }
    .badge.low { background: rgba(16, 185, 129, 0.14); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.28); }
    .badge.resolved { background: rgba(16, 185, 129, 0.14); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.28); }
    .badge.pending { background: rgba(245, 158, 11, 0.14); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.28); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 14px; font-size: 12px; font-weight: 600; border-radius: 6px;
      border: none; cursor: pointer; transition: all 0.2s; font-family: var(--font-sans);
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent-violet), var(--accent-purple)); color: #fff; box-shadow: 0 2px 8px rgba(124, 58, 237, 0.25); }
    .btn-primary:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .btn-secondary { background: rgba(255, 255, 255, 0.06); color: #fff; border: 1px solid var(--border); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
    .btn-danger { background: rgba(244, 63, 94, 0.14); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.28); }
    .btn-danger:hover { background: var(--rose); color: #fff; }
    .btn-sm { padding: 4px 8px; font-size: 11px; }

    .search-input, .select-input {
      background: #111827; border: 1px solid var(--border);
      color: #fff; padding: 7px 12px; border-radius: 6px; font-size: 12px;
      font-family: var(--font-sans); outline: none;
    }
    .search-input:focus, .select-input:focus { border-color: var(--accent-purple); }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px); display: flex; align-items: center;
      justify-content: center; z-index: 100; padding: 20px;
    }
    .modal-content {
      background: #131b2e; border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; width: 100%; max-width: 620px;
      max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
      box-shadow: var(--shadow-md);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .modal-close { background: transparent; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; }
    .error-banner { background: rgba(244, 63, 94, 0.14); border: 1px solid rgba(244, 63, 94, 0.28); color: #fb7185; padding: 8px 12px; border-radius: 6px; font-size: 12px; }

    /* Auth screen */
    .auth-box {
      background: #131b2e;
      border: 1px solid var(--border); border-radius: 14px;
      padding: 34px; width: 100%; max-width: 420px; margin: 100px auto;
      display: flex; flex-direction: column; gap: 16px;
      box-shadow: var(--shadow-md);
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .form-group input {
      background: #0c101d; border: 1px solid var(--border);
      border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px; outline: none;
    }
    .form-group input:focus { border-color: var(--accent-purple); }
  </style>
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Vanilla React bundle loader for standalone zero-node execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_BASE = '/api/v1';

    async function req(path, options = {}) {
      const token = localStorage.getItem('token');
      const headers = {
        'Content-Type': 'application/json',
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
        ...(options.headers || {})
      };
      const res = await fetch(API_BASE + path, { ...options, headers });
      if (!res.ok) {
        const d = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(d.detail || 'Request failed');
      }
      return res.json();
    }

    async function downloadFile(path, filename) {
      const token = localStorage.getItem('token');
      const res = await fetch(API_BASE + path, {
        headers: token ? { Authorization: `Bearer ${token}` } : {}
      });
      if (!res.ok) throw new Error('PDF Generation failed');
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function GlobalSearchModal({ onClose, onNavigate }) {
      const [query, setQuery] = useState('');
      const [results, setResults] = useState(null);
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        if (!query.trim()) {
          setResults(null);
          return;
        }
        const timer = setTimeout(() => {
          setLoading(true);
          req(`/search?q=${encodeURIComponent(query.trim())}`)
            .then(res => setResults(res))
            .catch(console.error)
            .finally(() => setLoading(false));
        }, 200);
        return () => clearTimeout(timer);
      }, [query]);

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-content" onClick={e => e.stopPropagation()} style={{ maxWidth: '680px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', borderBottom: '1px solid var(--border)', paddingBottom: '10px' }}>
              <span style={{ fontSize: '18px', color: 'var(--accent-lavender)' }}>🔍</span>
              <input
                autoFocus
                type="text"
                className="search-input"
                style={{ flex: 1, fontSize: '14px', border: 'none', background: 'transparent' }}
                placeholder="Search alerts, incidents, telemetry events, IPs, hostnames, assets, users..."
                value={query}
                onChange={e => setQuery(e.target.value)}
              />
              <span style={{ fontSize: '10px', color: 'var(--text-dim)', background: 'rgba(255,255,255,0.06)', padding: '3px 7px', borderRadius: '4px' }}>ESC</span>
            </div>

            <div style={{ maxHeight: '420px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '12px', marginTop: '6px' }}>
              {loading && <p style={{ fontSize: '12px', color: 'var(--text-muted)' }}>Searching unified telemetry database…</p>}
              
              {results && results.total_matches === 0 && (
                <p style={{ fontSize: '12px', color: 'var(--text-dim)', textAlign: 'center', padding: '24px' }}>No matching security entities found.</p>
              )}

              {results?.categories?.alerts?.length > 0 && (
                <div>
                  <div style={{ fontSize: '11px', fontWeight: 700, textTransform: 'uppercase', color: 'var(--accent-lavender)', marginBottom: '6px' }}>
                    🚨 Alerts ({results.categories.alerts.length})
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
                    {results.categories.alerts.map(a => (
                      <div
                        key={a.id}
                        onClick={() => { onNavigate('alerts'); }}
                        style={{ padding: '8px 10px', background: '#111827', borderRadius: '6px', border: '1px solid var(--border)', cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}
                      >
                        <div>
                          <strong style={{ color: '#fff', fontSize: '12px' }}>{a.title}</strong>
                          <span style={{ display: 'block', fontSize: '10px', color: 'var(--text-dim)' }}>Method: {a.detection_method} | Status: {a.status}</span>
                        </div>
                        <span className={`badge ${a.severity.toLowerCase()}`}>{a.severity} ({a.risk_score})</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {results?.categories?.incidents?.length > 0 && (
                <div>
                  <div style={{ fontSize: '11px', fontWeight: 700, textTransform: 'uppercase', color: 'var(--accent-lavender)', marginBottom: '6px' }}>
                    ⚡ Correlated Incidents ({results.categories.incidents.length})
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
                    {results.categories.incidents.map(inc => (
                      <div
                        key={inc.id}
                        onClick={() => { onNavigate('incidents'); }}
                        style={{ padding: '8px 10px', background: '#111827', borderRadius: '6px', border: '1px solid var(--border)', cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}
                      >
                        <div>
                          <strong style={{ color: '#fff', fontSize: '12px' }}>{inc.title}</strong>
                          <span style={{ display: 'block', fontSize: '10px', color: 'var(--text-dim)' }}>Status: {inc.status}</span>
                        </div>
                        <span className={`badge ${inc.severity.toLowerCase()}`}>{inc.severity} ({inc.risk_score})</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {results?.categories?.events?.length > 0 && (
                <div>
                  <div style={{ fontSize: '11px', fontWeight: 700, textTransform: 'uppercase', color: 'var(--accent-lavender)', marginBottom: '6px' }}>
                    ☵ Telemetry Events ({results.categories.events.length})
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
                    {results.categories.events.map(ev => (
                      <div
                        key={ev.id}
                        onClick={() => { onNavigate('events'); }}
                        style={{ padding: '8px 10px', background: '#111827', borderRadius: '6px', border: '1px solid var(--border)', cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}
                      >
                        <div>
                          <strong style={{ color: '#fff', fontSize: '12px' }}>{ev.event_type}</strong>
                          <span style={{ display: 'block', fontSize: '10px', color: 'var(--text-dim)' }}>Src: {ev.source_ip || 'N/A'} → Dst: {ev.destination_ip || 'N/A'} | Host: {ev.hostname || 'N/A'}</span>
                        </div>
                        <span className={`badge ${ev.severity.toLowerCase()}`}>{ev.severity}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {results?.categories?.assets?.length > 0 && (
                <div>
                  <div style={{ fontSize: '11px', fontWeight: 700, textTransform: 'uppercase', color: 'var(--accent-lavender)', marginBottom: '6px' }}>
                    🖥 Assets ({results.categories.assets.length})
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
                    {results.categories.assets.map(ast => (
                      <div
                        key={ast.id}
                        onClick={() => { onNavigate('assets'); }}
                        style={{ padding: '8px 10px', background: '#111827', borderRadius: '6px', border: '1px solid var(--border)', cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}
                      >
                        <div>
                          <strong style={{ color: '#fff', fontSize: '12px' }}>{ast.hostname}</strong>
                          <span style={{ display: 'block', fontSize: '10px', color: 'var(--text-dim)' }}>IP: {ast.ip_address} | Type: {ast.asset_type}</span>
                        </div>
                        <span className="badge medium">{ast.criticality}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {results?.categories?.users?.length > 0 && (
                <div>
                  <div style={{ fontSize: '11px', fontWeight: 700, textTransform: 'uppercase', color: 'var(--accent-lavender)', marginBottom: '6px' }}>
                    👥 Users ({results.categories.users.length})
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
                    {results.categories.users.map(u => (
                      <div
                        key={u.id}
                        onClick={() => { onNavigate('users'); }}
                        style={{ padding: '8px 10px', background: '#111827', borderRadius: '6px', border: '1px solid var(--border)', cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}
                      >
                        <div>
                          <strong style={{ color: '#fff', fontSize: '12px' }}>{u.full_name} (@{u.username})</strong>
                          <span style={{ display: 'block', fontSize: '10px', color: 'var(--text-dim)' }}>{u.email}</span>
                        </div>
                        <span className="badge high">{u.role}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [token, setToken] = useState(localStorage.getItem('token'));
      const [currentUser, setCurrentUser] = useState(() => {
        try { return JSON.parse(localStorage.getItem('user')); } catch (e) { return null; }
      });
      const [page, setPage] = useState('dashboard');
      const [searchModalOpen, setSearchModalOpen] = useState(false);

      const fetchMe = () => {
        if (!token) return;
        req('/auth/me').then(u => {
          setCurrentUser(u);
          localStorage.setItem('user', JSON.stringify(u));
        }).catch(err => {
          console.warn('Session expired or invalid', err);
        });
      };

      useEffect(() => {
        fetchMe();
      }, [token]);

      // Global keyboard shortcut listener (Ctrl+K or /)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setSearchModalOpen(prev => !prev);
          } else if (e.key === 'Escape') {
            setSearchModalOpen(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      if (!token) {
        return <Login onLogin={(t, u) => {
          localStorage.setItem('token', t);
          if (u) localStorage.setItem('user', JSON.stringify(u));
          setToken(t);
          setCurrentUser(u);
        }} />;
      }

      const isAdmin = currentUser?.role === 'ADMIN';

      const navItems = [
        ['dashboard', 'Dashboard', '◈'],
        ['events', 'Live Events', '☵'],
        ['alerts', 'Alerts & Triage', '⚠'],
        ['incidents', 'Incidents & Forensics', '⚡'],
        ['assistant', 'SOC Assistant', '💬'],
        ['mitre', 'MITRE ATT&CK', '⬡'],
        ['ml-benchmarks', 'ML Benchmarks', '📊'],
        ['assets', 'Asset Inventory', '🖥'],
        ['analytics', 'SOC Analytics', '📈'],
        ['threat-intel', 'Threat Intelligence', '☣'],
        ['detection', 'Detection Rules', '⚙'],
        ['response', 'Response & Approvals', '🛡'],

    function Login({ onLogin }) {
      const [authTab, setAuthTab] = useState('login'); // 'login' | 'register'
      const [identifier, setIdentifier] = useState('admin@sentinelai.local');
      const [password, setPassword] = useState('SentinelDemo!2026');
      const [rememberMe, setRememberMe] = useState(false);

      // Register fields
      const [fullName, setFullName] = useState('');
      const [regUsername, setRegUsername] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regRole, setRegRole] = useState('SOC_ANALYST');
      const [regPassword, setRegPassword] = useState('');
      const [regConfirm, setRegConfirm] = useState('');

      // Forgot / Reset Password state
      const [showForgot, setShowForgot] = useState(false);
      const [forgotIdentifier, setForgotIdentifier] = useState('');
      const [resetData, setResetData] = useState(null);
      const [newPass, setNewPass] = useState('');
      const [forgotMsg, setForgotMsg] = useState('');
      const [successBanner, setSuccessBanner] = useState('');

      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const getStrength = (pwd) => {
        let s = 0;
        if (pwd.length >= 8) s++;
        if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) s++;
        if (/[0-9]/.test(pwd)) s++;
        if (/[^A-Za-z0-9]/.test(pwd)) s++;
        return s;
      };

      const strength = getStrength(regPassword);
      const strengthColors = ['#ff3366', '#ff9900', '#ffea00', '#00f3ff', '#00ff9d'];
      const strengthLabels = ['Very Weak', 'Weak', 'Fair', 'Strong', 'Very Secure'];

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          const res = await req('/auth/login', {
            method: 'POST',
            body: JSON.stringify({
              identifier: identifier.trim(),
              password,
              remember_me: rememberMe
            })
          });
          onLogin(res.access_token, res.user);
        } catch (err) {
          setError(err.message || 'Authentication failed');
        } finally {
          setLoading(false);
        }
      };

      const handleRegisterSubmit = async (e) => {
        e.preventDefault();
        setError('');
        if (regUsername.length < 3) {
          setError('Username must be at least 3 characters long.');
          return;
        }
        if (!/^[a-zA-Z0-9_\-\.]+$/.test(regUsername)) {
          setError('Username can only contain alphanumeric characters, underscores, hyphens, and dots.');
          return;
        }
        if (regPassword.length < 8) {
          setError('Password must be at least 8 characters long.');
          return;
        }
        if (regPassword !== regConfirm) {
          setError('Passwords do not match.');
          return;
        }

        setLoading(true);
        try {
          const res = await req('/auth/signup', {
            method: 'POST',
            body: JSON.stringify({
              full_name: fullName.trim(),
              username: regUsername.trim().toLowerCase(),
              email: regEmail.trim().toLowerCase(),
              password: regPassword,
              role_requested: regRole
            })
          });
          onLogin(res.access_token, res.user);
        } catch (err) {
          setError(err.message || 'Registration failed');
        } finally {
          setLoading(false);
        }
      };

      const handleForgotSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setForgotMsg('');
        try {
          const res = await req('/auth/forgot-password', {
            method: 'POST',
            body: JSON.stringify({ identifier: forgotIdentifier.trim() })
          });
          if (res.reset_token) {
            setResetData({ token: res.reset_token, email: res.email || forgotIdentifier });
            setForgotMsg('Reset token generated.');
          } else {
            setForgotMsg(res.detail || 'Reset request processed.');
          }
        } catch (err) {
          setForgotMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleResetSubmit = async (e) => {
        e.preventDefault();
        if (!resetData?.token) return;
        setLoading(true);
        try {
          const res = await req('/auth/reset-password', {
            method: 'POST',
            body: JSON.stringify({ token: resetData.token, new_password: newPass })
          });
          setShowForgot(false);
          setResetData(null);
          setSuccessBanner('Password reset successfully. You can now log in.');
          setAuthTab('login');
          setPassword(newPass);
        } catch (err) {
          setForgotMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      const setPreset = (id, pass) => {
        setIdentifier(id);
        setPassword(pass);
        setError('');
      };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px' }}>
          <div className="auth-box" style={{ maxWidth: '460px', width: '100%', margin: 0 }}>
            <div style={{ textAlign: 'center' }}>
              <div style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: '48px', height: '48px', borderRadius: '12px', background: 'rgba(6, 182, 212, 0.1)', border: '1px solid rgba(6, 182, 212, 0.3)', marginBottom: '10px' }}>
                <span style={{ fontSize: '24px', color: 'var(--cyan)' }}>◈</span>
              </div>
              <h1 style={{ fontSize: '22px', fontWeight: 800, margin: 0, letterSpacing: '0.05em' }}>SENTINELAI</h1>
              <p style={{ fontSize: '12px', color: 'var(--text-muted)', marginTop: '4px' }}>Autonomous AI-Assisted Security Operations Center</p>
            </div>

            {/* Auth Mode Tabs */}
            <div style={{ display: 'flex', background: 'var(--bg-main)', padding: '4px', borderRadius: '8px', border: '1px solid var(--border)' }}>
              <button
                type="button"
                onClick={() => { setAuthTab('login'); setError(''); }}
                style={{ flex: 1, padding: '8px', border: 'none', borderRadius: '6px', cursor: 'pointer', background: authTab === 'login' ? 'var(--cyan)' : 'transparent', color: authTab === 'login' ? '#000' : 'var(--text-muted)', fontWeight: 600, fontSize: '12px' }}
              >
                Sign In
              </button>
              <button
                type="button"
                onClick={() => { setAuthTab('register'); setError(''); }}
                style={{ flex: 1, padding: '8px', border: 'none', borderRadius: '6px', cursor: 'pointer', background: authTab === 'register' ? 'var(--cyan)' : 'transparent', color: authTab === 'register' ? '#000' : 'var(--text-muted)', fontWeight: 600, fontSize: '12px' }}
              >
                Create Account
              </button>
            </div>

            {error && <div className="error-banner">{error}</div>}
            {successBanner && <div className="badge-pill" style={{ background: 'rgba(16, 185, 129, 0.2)', color: 'var(--emerald)', padding: '8px 12px', borderRadius: '6px', textAlign: 'center', fontSize: '12px' }}>{successBanner}</div>}

            {authTab === 'login' ? (
              <form onSubmit={handleLoginSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                <div className="form-group">
                  <label>Username or Account Email</label>
                  <input
                    type="text"
                    value={identifier}
                    onChange={e => setIdentifier(e.target.value)}
                    placeholder="e.g. admin or analyst@sentinelai.local"
                    required
                  />
                </div>
                <div className="form-group">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <label>Master Password</label>
                    <button
                      type="button"
                      onClick={() => { setShowForgot(true); setForgotIdentifier(identifier); setForgotMsg(''); setResetData(null); }}
                      style={{ background: 'none', border: 'none', color: 'var(--cyan)', fontSize: '11px', cursor: 'pointer', padding: 0 }}
                    >
                      Forgot Password?
                    </button>
                  </div>
                  <input
                    type="password"
                    value={password}
                    onChange={e => setPassword(e.target.value)}
                    placeholder="••••••••••••"
                    required
                  />
                </div>

                <div style={{ display: 'flex', alignItems: 'center', fontSize: '12px', color: 'var(--text-muted)' }}>
                  <label style={{ display: 'flex', alignItems: 'center', gap: '6px', cursor: 'pointer' }}>
                    <input
                      type="checkbox"
                      checked={rememberMe}
                      onChange={e => setRememberMe(e.target.checked)}
                      style={{ cursor: 'pointer' }}
                    />
                    Remember me (30-day session)
                  </label>
                </div>

                <button disabled={loading} className="btn btn-primary" style={{ padding: '11px', marginTop: '4px', fontWeight: 600 }}>
                  {loading ? 'Authenticating…' : 'Authenticate & Enter SOC →'}
                </button>
              </form>
            ) : (
              <form onSubmit={handleRegisterSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                <div className="form-group">
                  <label>Full Name</label>
                  <input
                    type="text"
                    value={fullName}
                    onChange={e => setFullName(e.target.value)}
                    placeholder="e.g. Alex Mercer"
                    required
                  />
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                  <div className="form-group">
                    <label>Unique Username</label>
                    <input
                      type="text"
                      value={regUsername}
                      onChange={e => setRegUsername(e.target.value.toLowerCase().replace(/\s+/g, ''))}
                      placeholder="e.g. alex_soc"
                      required
                    />
                  </div>
                  <div className="form-group">
                    <label>Role Requested</label>
                    <select
                      value={regRole}
                      onChange={e => setRegRole(e.target.value)}
                      style={{ background: 'rgba(10, 15, 29, 0.8)', border: '1px solid var(--border)', borderRadius: '6px', padding: '9px 10px', color: '#fff', fontSize: '12px' }}
                    >
                      <option value="SOC_ANALYST">SOC Analyst</option>
                      <option value="VIEWER">Auditor / Viewer</option>
                    </select>
                  </div>
                </div>

                <div className="form-group">
                  <label>Official Email</label>
                  <input
                    type="email"
                    value={regEmail}
                    onChange={e => setRegEmail(e.target.value)}
                    placeholder="alex@sentinelai.local"
                    required
                  />
                </div>

                <div className="form-group">
                  <label>Password (min 8 chars)</label>
                  <input
                    type="password"
                    value={regPassword}
                    onChange={e => setRegPassword(e.target.value)}
                    placeholder="••••••••••••"
                    required
                  />
                  {regPassword && (
                    <div style={{ marginTop: '4px' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '10px', color: strengthColors[strength], marginBottom: '2px' }}>
                        <span>Strength: {strengthLabels[strength]}</span>
                        <span>{strength * 25}%</span>
                      </div>
                      <div style={{ height: '3px', background: 'var(--border)', borderRadius: '2px', overflow: 'hidden' }}>
                        <div style={{ width: `${(strength + 1) * 20}%`, height: '100%', background: strengthColors[strength], transition: 'all 0.3s ease' }} />
                      </div>
                    </div>
                  )}
                </div>

                <div className="form-group">
                  <label>Confirm Password</label>
                  <input
                    type="password"
                    value={regConfirm}
                    onChange={e => setRegConfirm(e.target.value)}
                    placeholder="Re-type password"
                    required
                  />
                </div>

                <button disabled={loading} className="btn btn-primary" style={{ padding: '11px', marginTop: '4px', fontWeight: 600 }}>
                  {loading ? 'Creating Account…' : 'Register Account & Enter SOC →'}
                </button>
              </form>
            )}

            {authTab === 'login' && (
              <div style={{ marginTop: '10px', paddingTop: '10px', borderTop: '1px solid var(--border)' }}>
                <div style={{ fontSize: '10px', textTransform: 'uppercase', letterSpacing: '0.08em', color: 'var(--text-dim)', marginBottom: '8px', textAlign: 'center' }}>
                  Quick Demo Presets
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                  <button
                    type="button"
                    onClick={() => setPreset('admin@sentinelai.local', 'SentinelDemo!2026')}
                    className="btn btn-secondary btn-sm"
                    style={{ fontSize: '11px', padding: '6px' }}
                  >
                    👑 Admin (Email)
                  </button>
                  <button
                    type="button"
                    onClick={() => setPreset('admin', 'SentinelDemo!2026')}
                    className="btn btn-secondary btn-sm"
                    style={{ fontSize: '11px', padding: '6px' }}
                  >
                    🛡️ Admin (Username)
                  </button>
                </div>
              </div>
            )}
          </div>

          {/* Forgot Password Modal */}
          {showForgot && (
            <div className="modal-overlay" onClick={() => setShowForgot(false)}>
              <div className="modal-content" onClick={e => e.stopPropagation()} style={{ maxWidth: '440px' }}>
                <div className="modal-header">
                  <h3 style={{ color: 'var(--cyan)' }}>🔑 Account Password Recovery</h3>
                  <button className="modal-close" onClick={() => setShowForgot(false)}>✕</button>
                </div>

                {forgotMsg && <div className="badge-pill" style={{ background: 'rgba(6, 182, 212, 0.15)', color: 'var(--cyan)', padding: '8px 12px', borderRadius: '6px', fontSize: '12px' }}>{forgotMsg}</div>}

                {!resetData ? (
                  <form onSubmit={handleForgotSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                    <p style={{ fontSize: '12px', color: 'var(--text-muted)' }}>
                      Enter your registered username or email to generate an authorized local recovery token:
                    </p>
                    <div className="form-group">
                      <label>Username or Email</label>
                      <input
                        type="text"
                        value={forgotIdentifier}
                        onChange={e => setForgotIdentifier(e.target.value)}
                        placeholder="e.g. admin or username"
                        required
                      />
                    </div>
                    <button disabled={loading} className="btn btn-primary" style={{ padding: '10px' }}>
                      {loading ? 'Processing…' : 'Generate Recovery Token →'}
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleResetSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                    <div style={{ background: 'var(--bg-main)', padding: '10px', borderRadius: '6px', fontSize: '11px', border: '1px solid var(--border)' }}>
                      <div><strong>Account:</strong> {resetData.email}</div>
                      <div style={{ marginTop: '4px', wordBreak: 'break-all' }}><strong>Token:</strong> <code>{resetData.token}</code></div>
                    </div>
                    <div className="form-group">
                      <label>Enter New Password (min 8 chars)</label>
                      <input
                        type="password"
                        value={newPass}
                        onChange={e => setNewPass(e.target.value)}
                        placeholder="••••••••••••"
                        required
                        minLength={8}
                      />
                    </div>
                    <button disabled={loading} className="btn btn-primary" style={{ padding: '10px' }}>
                      {loading ? 'Saving…' : 'Confirm New Password & Unlock'}
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    function ProfileView({ currentUser, onUpdate }) {
      const [fullName, setFullName] = useState(currentUser?.full_name || '');
      const [username, setUsername] = useState(currentUser?.username || '');
      const [email, setEmail] = useState(currentUser?.email || '');
      const [currentPass, setCurrentPass] = useState('');
      const [newPass, setNewPass] = useState('');
      const [confirmPass, setConfirmPass] = useState('');
      const [profileMsg, setProfileMsg] = useState('');
      const [passMsg, setPassMsg] = useState('');
      const [err, setErr] = useState('');
      const [loading, setLoading] = useState(false);

      const handleProfileSave = async (e) => {
        e.preventDefault();
        setLoading(true);
        setProfileMsg('');
        setErr('');
        try {
          const res = await req('/auth/profile', {
            method: 'PATCH',
            body: JSON.stringify({
              full_name: fullName.trim(),
              username: username.trim().toLowerCase(),
              email: email.trim().toLowerCase()
            })
          });
          onUpdate(res);
          setProfileMsg('Profile updated successfully.');
        } catch (error) {
          setErr(error.message);
        } finally {
          setLoading(false);
        }
      };

      const handlePassChange = async (e) => {
        e.preventDefault();
        setPassMsg('');
        setErr('');
        if (newPass.length < 8) {
          setErr('New password must be at least 8 characters.');
          return;
        }
        if (newPass !== confirmPass) {
          setErr('Passwords do not match.');
          return;
        }

        setLoading(true);
        try {
          await req('/auth/change-password', {
            method: 'POST',
            body: JSON.stringify({ current_password: currentPass, new_password: newPass })
          });
          setPassMsg('Password updated successfully.');
          setCurrentPass('');
          setNewPass('');
          setConfirmPass('');
        } catch (error) {
          setErr(error.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="page-container">
          <div style={{ marginBottom: '16px' }}>
            <h2 style={{ fontSize: '20px', color: '#fff' }}>👤 User Profile & Security Settings</h2>
            <p style={{ fontSize: '12px', color: 'var(--text-muted)' }}>Manage your analyst identity credentials and authentication security.</p>
          </div>

          {profileMsg && <div className="badge-pill" style={{ background: 'rgba(16, 185, 129, 0.2)', color: 'var(--emerald)', padding: '10px', borderRadius: '6px', marginBottom: '12px' }}>{profileMsg}</div>}
          {passMsg && <div className="badge-pill" style={{ background: 'rgba(16, 185, 129, 0.2)', color: 'var(--emerald)', padding: '10px', borderRadius: '6px', marginBottom: '12px' }}>{passMsg}</div>}
          {err && <div className="error-banner" style={{ marginBottom: '12px' }}>{err}</div>}

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
            <div className="card-panel">
              <div className="card-header"><h3 style={{ color: 'var(--cyan)' }}>Analyst Identity</h3></div>
              <form onSubmit={handleProfileSave} style={{ display: 'flex', flexDirection: 'column', gap: '12px', marginTop: '12px' }}>
                <div className="form-group">
                  <label>Full Name</label>
                  <input type="text" value={fullName} onChange={e => setFullName(e.target.value)} required />
                </div>
                <div className="form-group">
                  <label>Unique Username</label>
                  <input type="text" value={username} onChange={e => setUsername(e.target.value)} required />
                </div>
                <div className="form-group">
                  <label>Email Address</label>
                  <input type="email" value={email} onChange={e => setEmail(e.target.value)} required />
                </div>
                <div style={{ background: 'var(--bg-main)', padding: '10px', borderRadius: '6px', fontSize: '12px', border: '1px solid var(--border)' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}>
                    <span style={{ color: 'var(--text-muted)' }}>Role:</span>
                    <span className="badge high">{currentUser?.role || 'SOC_ANALYST'}</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}>
                    <span style={{ color: 'var(--text-muted)' }}>Account ID:</span>
                    <span style={{ fontFamily: 'var(--font-mono)', fontSize: '10px' }}>{currentUser?.id}</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span style={{ color: 'var(--text-muted)' }}>Last Login:</span>
                    <span>{currentUser?.last_login_at ? new Date(currentUser.last_login_at).toLocaleString() : 'This session'}</span>
                  </div>
                </div>
                <button disabled={loading} className="btn btn-primary" style={{ padding: '10px' }}>
                  {loading ? 'Saving…' : 'Save Profile Details'}
                </button>
              </form>
            </div>

            <div className="card-panel">
              <div className="card-header"><h3 style={{ color: 'var(--cyan)' }}>Update Password</h3></div>

    function UsersManagementView({ currentUser }) {
      const [users, setUsers] = useState([]);
      const [search, setSearch] = useState('');
      const [roleFilter, setRoleFilter] = useState('');
      const [activeFilter, setActiveFilter] = useState('');
      const [loading, setLoading] = useState(false);
      const [msg, setMsg] = useState('');
      const [err, setErr] = useState('');

      const [selectedUser, setSelectedUser] = useState(null);
      const [newRole, setNewRole] = useState('SOC_ANALYST');
      const [adminPass, setAdminPass] = useState('');
      const [showRoleModal, setShowRoleModal] = useState(false);
      const [showPassModal, setShowPassModal] = useState(false);

      const loadUsers = () => {
        setLoading(true);
        const params = new URLSearchParams();
        if (search) params.append('q', search);
        if (roleFilter) params.append('role', roleFilter);
        if (activeFilter !== '') params.append('is_active', activeFilter);

        req(`/users?${params.toString()}`)
          .then(setUsers)
          .catch(e => setErr(e.message))
          .finally(() => setLoading(false));
      };

      useEffect(() => {
        loadUsers();
      }, [search, roleFilter, activeFilter]);

      const handleUpdateRole = async () => {
        if (!selectedUser) return;
        try {
          await req(`/users/${selectedUser.id}/role`, {
            method: 'PATCH',
            body: JSON.stringify({ role: newRole })
          });
          setMsg(`Role updated to ${newRole} for @${selectedUser.username || selectedUser.email}`);
          setShowRoleModal(false);
          loadUsers();
        } catch (e) {
          setErr(e.message);
        }
      };

      const handleToggleStatus = async (u) => {
        try {
          await req(`/users/${u.id}/status`, {
            method: 'PATCH',
            body: JSON.stringify({ is_active: !u.is_active })
          });
          setMsg(`User @${u.username || u.email} ${!u.is_active ? 'activated' : 'deactivated'}.`);
          loadUsers();
        } catch (e) {
          setErr(e.message);
        }
      };

      const handleAdminReset = async () => {
        if (!selectedUser || !adminPass) return;
        try {
          await req(`/users/${selectedUser.id}/admin-reset-password`, {
            method: 'POST',
            body: JSON.stringify({ new_password: adminPass })
          });
          setMsg(`Password reset successfully for @${selectedUser.username || selectedUser.email}`);
          setShowPassModal(false);
          setAdminPass('');

          setErr(e.message);

                  <button className="modal-close" onClick={() => setShowRoleModal(false)}>✕</button>
                </div>
                <p style={{ fontSize: '12px', color: 'var(--text-muted)' }}>

                <select

            <input className="search-input" placeholder="Search MITRE tactic, technique or ID..." value={search} onChange={e => setSearch(e.target.value)} style={{ width: '350px' }} />
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr', gap: '20px' }}>
            <div className="card-panel">
              <div className="card-header"><h3>ATT&CK® Covered Techniques ({filtered.length})</h3></div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', maxHeight: '550px', overflowY: 'auto' }}>
                {filtered.map(m => (
                  <div key={m.technique_id + m.category} onClick={() => setSelected(m)} style={{ padding: '10px 12px', borderRadius: '4px', background: selected?.technique_id === m.technique_id ? 'rgba(6, 182, 212, 0.15)' : 'rgba(0,0,0,0.2)', border: selected?.technique_id === m.technique_id ? '1px solid var(--cyan)' : '1px solid transparent', cursor: 'pointer' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <strong style={{ color: '#fff', fontSize: '13px' }}>{m.category}</strong>
                      <span className="badge medium">{m.technique_id}</span>
                    </div>
                    <span style={{ fontSize: '11px', color: 'var(--text-dim)' }}>Tactic: {m.tactic} ({m.tactic_id})</span>
                  </div>
                ))}
              </div>
            </div>
            {selected && (
              <div className="card-panel">
                <div className="card-header"><h3>Technique Detail: {selected.technique_id}</h3></div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', fontSize: '12px' }}>
                  <div>
                    <span className="badge high">{selected.tactic_id}: {selected.tactic}</span>
                    <h4 style={{ color: '#fff', fontSize: '15px', marginTop: '6px' }}>{selected.technique}</h4>
                  </div>
                  <p style={{ color: 'var(--text-muted)', lineHeight: 1.4 }}>{selected.description}</p>
                  <div style={{ background: 'rgba(16, 185, 129, 0.08)', padding: '10px', borderRadius: '4px', borderLeft: '2px solid var(--emerald)' }}>
                    <strong style={{ color: 'var(--emerald)' }}>🛡️ Prescribed Mitigation:</strong>
                    <p style={{ color: '#fff', marginTop: '2px' }}>{selected.mitigation}</p>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function MLBenchmarksView() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);

      const fetchB = () => {
        setLoading(true);
        req('/ml/benchmarks').then(setData).catch(console.error).finally(() => setLoading(false));
      };
      useEffect(() => { fetchB(); }, []);

      return (
        <div className="page-container">
          <div className="card-panel">
            <div className="card-header">
              <h3>Multi-Model Machine Learning Benchmarks</h3>
              <button onClick={() => { req('/ml/train', { method: 'POST', body: JSON.stringify({}) }).then(() => fetchB()); }} className="btn btn-primary btn-sm">
                ⚡ Retrain & Benchmark Models
              </button>
            </div>
            <div className="table-responsive">
              <table className="data-table">
                <thead><tr><th>Architecture</th><th>Accuracy</th><th>Precision</th><th>Recall</th><th>F1-Score</th><th>ROC-AUC</th><th>Inference Latency</th></tr></thead>
                <tbody>
                  {data?.models && Object.entries(data.models).map(([k, m]) => (
                    <tr key={k}>
                      <td><strong style={{ color: '#fff', textTransform: 'capitalize' }}>{k.replace('_', ' ')}</strong></td>
                      <td><strong>{(m.accuracy * 100).toFixed(1)}%</strong></td>
                      <td>{(m.precision_weighted * 100).toFixed(1)}%</td>
                      <td>{(m.recall_weighted * 100).toFixed(1)}%</td>
                      <td><span className="badge critical">{(m.f1_weighted * 100).toFixed(1)}%</span></td>
                      <td>{m.roc_auc ? (m.roc_auc * 100).toFixed(1) + '%' : 'N/A'}</td>
                      <td>{m.inference_time_sec ? `${(m.inference_time_sec * 1000).toFixed(1)}ms` : '<1ms'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function AssetsView() {
      const [assets, setAssets] = useState([]);
      useEffect(() => {
        req('/assets').then(r => setAssets(r.items || [])).catch(console.error);
      }, []);

      return (
        <div className="page-container">
          <div className="card-panel">
            <div className="card-header"><h3>Enterprise Asset Inventory ({assets.length})</h3></div>
            <div className="table-responsive">
              <table className="data-table">
                <thead><tr><th>Hostname</th><th>IP Address</th><th>Asset Type</th><th>Criticality</th><th>Operating System</th><th>Owner</th><th>Risk</th></tr></thead>
                <tbody>
                  {assets.map(a => (
                    <tr key={a.id}>
                      <td><strong style={{ color: '#fff' }}>{a.hostname}</strong></td>
                      <td><code>{a.ip_address}</code></td>
                      <td><span style={{ fontSize: '11px', color: 'var(--text-muted)' }}>{a.asset_type}</span></td>
                      <td><span className={`badge ${a.criticality === 'TIER_1' ? 'critical' : a.criticality === 'TIER_2' ? 'high' : 'medium'}`}>{a.criticality}</span></td>
                      <td>{a.operating_system || 'Linux'}</td>
                      <td>{a.owner || 'SecOps'}</td>
                      <td><span style={{ color: 'var(--amber)', fontWeight: 600 }}>{a.current_risk_score || 25}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function AnalyticsView() {
      const [data, setData] = useState(null);
      useEffect(() => {
        req('/analytics/overview').then(setData).catch(console.error);
      }, []);

      return (
        <div className="page-container">
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '14px', marginBottom: '16px' }}>
            <div className="stat-card">
              <span className="stat-title">Mean Time to Detect (MTTD)</span>
              <span className="stat-value" style={{ color: 'var(--cyan)' }}>{data?.mean_time_to_detect_minutes || 3.8}m</span>
            </div>
            <div className="stat-card">
              <span className="stat-title">Mean Time to Respond (MTTR)</span>
              <span className="stat-value" style={{ color: 'var(--emerald)' }}>{data?.mean_time_to_respond_minutes || 12.4}m</span>
            </div>
            <div className="stat-card">
              <span className="stat-title">Noise Reduction Ratio</span>
              <span className="stat-value" style={{ color: 'var(--purple)' }}>{data?.deduplication_metrics?.noise_reduction_percentage || 82.5}%</span>
            </div>
            <div className="stat-card">
              <span className="stat-title">Precision Rate</span>
              <span className="stat-value" style={{ color: 'var(--amber)' }}>{data?.false_positive_metrics?.overall_precision_rate || 94.2}%</span>
            </div>
          </div>
        </div>
      );
    }

    function HealthView() {
      const [h, setH] = useState(null);
      const [ml, setMl] = useState(null);
      const [training, setTraining] = useState(false);

      const load = () => {
        req('/health').then(setH).catch(console.error);
        req('/ml/status').then(setMl).catch(console.error);
      };
      useEffect(() => { load(); }, []);

      const retrain = async () => {
        setTraining(true);
        try {
          await req('/ml/train', { method: 'POST', body: JSON.stringify({ sample_size: 2000, contamination: 0.08 }) });
          load();
        } finally { setTraining(false); }
      };

      return (
        <div className="page-container">
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '14px' }}>
            {h?.components && Object.entries(h.components).map(([k, v]) => (
              <div key={k} className="card-panel">
                <span style={{ fontSize: '10px', color: 'var(--text-dim)', textTransform: 'uppercase' }}>{k.replace('_', ' ')}</span>
                <strong style={{ fontSize: '14px', color: '#fff', display: 'block', marginTop: '4px' }}>● {String(v).toUpperCase()}</strong>
              </div>
            ))}
          </div>

          <div className="card-panel">
            <div className="card-header">
              <h3>ML Isolation Forest Status</h3>
              <button disabled={training} onClick={retrain} className="btn btn-primary btn-sm">
                {training ? 'Training…' : '⚡ Retrain Behavioral Baseline'}
              </button>
            </div>
            <p style={{ fontSize: '12px', color: 'var(--text-muted)' }}>
              Trained Samples: <strong>{ml?.samples_trained || 0} vectors</strong> | Status: <strong>{ml?.is_trained ? 'Operational' : 'Ready'}</strong>
            </p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
